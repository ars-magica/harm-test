[]{#rego-mentem-guidelines}

::: {.mw-heading .mw-heading3}
### Rego Mentem Guidelines {#Rego_Mentem_Guidelines}
:::

The Rego Animal spells that deal with the mind may also be used as good
guidelines for levels of Rego Mentem spells. Many changes to the mind
are Rego effects, because the mind could naturally assume that state.

Rego Mentem botches can change the target\'s mental state in the wrong
way, or change the state of mind of the caster.

  -----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
  Community Gloss
  Note that this Art should be able to affect dreams, and indeed does by Art & Academe spell guidelines (see below). See also [The Mysteries: Revised Edition Chapter Twelve: The Mysteries of Dreams](/page/The_Mysteries:_Revised_Edition_Chapter_Twelve:_The_Mysteries_of_Dreams "The Mysteries: Revised Edition Chapter Twelve: The Mysteries of Dreams") for further discussion of dreams and related magic.
  -----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

  ----------------------------------- --------------------------------------------------------------------------------------------------
  Level                               Rego Mentem Guideline

  General                             • Ward against beings associated with Mentem from one supernatural realm (Divine, Faerie,
                                      Infernal, or Magic) with Might less than or equal to the level of the spell (Touch, Ring, Circle)\
                                      • Ward against spirits belonging to one realm (Divine, Faerie, Infernal, or Magic) with a Might
                                      less than or equal to the level of the spell (Touch, Ring, Circle)

  3                                   • Make a subtle difference to the target\'s mental state

  4                                   • Control a target\'s mental state (for example, awake, asleep, or confused)

  5                                   • Control a natural emotion (for example, calm, fear); the target must feel the emotion before you
                                      can control it. *Community Gloss: [Art &
                                      Academe](/page/Art_%26_Academe_Open_Content#Rego_Mentem_Guidelines "Art & Academe Open Content")
                                      maintains this can also cause the target to pay attention to a particular sensory stimulus, that
                                      has been experienced by the target before.*\
                                      • Control a disembodied spirit associated with Mentem, such as most ghosts\
                                      • Incline a person to a particular sort of response. *Community Gloss: [Art &
                                      Academe](/page/Art_%26_Academe_Open_Content#Rego_Mentem_Guidelines "Art & Academe Open Content")
                                      maintains this can also increase focus, and allows the subject (but not the content) of a dream to
                                      be determined by the caster.*

