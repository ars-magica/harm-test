[]{#perdo-ignem-guidelines}

::: {.mw-heading .mw-heading3}
### Perdo Ignem Guidelines {#Perdo_Ignem_Guidelines}
:::

The intensity of a fire also affects the difficulty of destroying it.
For every five points by which the fire\'s damage exceeds +5, add one
magnitude to the level of the spell.

Perdo Ignem botches might create fire instead of destroying it, or
freeze the caster.

  ----------------------------------- -----------------------------------
  Level                               Perdo Ignem Guideline

  General                             • Destroy sufficient matter to
                                      reduce a fire elemental\'s Might
                                      Score by the level of the spell +2
                                      magnitudes

  2                                   • Greatly reduce the amount of
                                      light in an area

  3                                   • Completely extinguish all light
                                      in an area\
                                      • Reduce the size of a fire without
                                      destroying it completely

  4                                   • Extinguish a fire, cooling the
                                      ashes to merely warm\
                                      • Chill an object\
                                      • Chill a person so that they lose
                                      a Fatigue level

  5                                   • Strongly chill an object (for
                                      example, freeze water)\
                                      • Chill a person so that they take
                                      +5 damage

  10                                  • Destroy one aspect of a fire (for
                                      example, heat or light)\
                                      • Chill a person so strongly that
                                      they take +10 damage
  ----------------------------------- -----------------------------------

