[]{#herbam-spells}

::: {.mw-heading .mw-heading2}
## Herbam Spells {#Herbam_Spells}
:::

Herbam spells work on plants and plant matter, both living and dead.
Since wood is a common material in weapons, vehicles, and buildings,
Herbam spells can be useful in improving or destroying physical things.
They can also be used to bring the plant world to your aid.

A base Individual for Herbam is a plant roughly one pace in each
direction.

[]{#creo-herbam-guidelines}

::: {.mw-heading .mw-heading3}
### Creo Herbam Guidelines {#Creo_Herbam_Guidelines}
:::

These spells create and heal plants. Any food created is nutritious only
if the creation is a Ritual. The guideline levels given below are
generally for conjuring the leafy parts of plants.

Plants may be created living or dead with equal ease. To create treated
Herbam products (for example, cut timber, a vegetarian meal, or linen or
cotton cloth) add one magnitude to the level necessary to create the
equivalent amount of unworked living or dead plants. To create treated
and processed Herbam products (for example, clothes or furniture), add
two magnitudes.

A single spell generally only creates a single type of plant product.

Creo Herbam botches may create plants in the wrong place, or create the
wrong kind of plant.

  ----------------------------------- -----------------------------------
  Level                               Creo Herbam Guideline

  1                                   • Ensure that a plant grows well
                                      for the duration of the spell (can
                                      affect a plant up to ten paces in
                                      each direction, i.e. a large tree;
                                      includes a +3 Size enhancement)\
                                      • Create a plant product (like a
                                      fruit or leaf)\
                                      • Create a plant\
                                      • Prevent a plant from becoming
                                      sick\
                                      • Heal a Light Wound to a plant

  2                                   • Create a processed plant product,
                                      like a finished plank of wood\
                                      • Preserve a dead plant from decay\
                                      • Heal a Medium Wound to a plant

  3                                   • Create wood in an unnatural
                                      shape, such as a living wall or
                                      bridge\
                                      • Heal a Heavy Wound to a plant

  4                                   • Heal an Incapacitating Wound to a
                                      plant

  5                                   • Heal all Wounds to a plant

  10                                  • Heal all damage to a plant,
                                      including wounds, disease, and
                                      poison

  15                                  • Bring a plant to maturity in a
                                      single day or night (accelerated
                                      growth only happens during the
                                      duration of the spell; full
                                      maturity requires a Sun duration
                                      spell cast soon after sunrise or
                                      sunset)\
                                      • Restore a manufactured wooden
                                      item that has been damaged to the
                                      peak of its capabilities (can also
                                      restore decay, but the damage must
                                      be light)

  20                                  • Bring a plant to maturity in
                                      about two hours

  25                                  • Bring a plant to maturity in
                                      about ten Diameters (twenty
                                      minutes)

  30                                  • Bring a plant to maturity in a
                                      single Diameter

  40                                  • Bring a plant to maturity in a
                                      moment
  ----------------------------------- -----------------------------------

