[]{#level-75}

::: {.mw-heading .mw-heading4}
#### LEVEL 75 {#LEVEL_75}
:::

[]{#the-shadow-of-life-renewed}

::: {.mw-heading .mw-heading5}
- spell: The Shadow of Life Renewed {#The_Shadow_of_Life_Renewed}
  cite: [Redcap](https://www.redcap.org/page/Ars_Magica_Definitive_Edition,_Chapter_Nine:_Spells
:::

  range: Touch
  duration: Mom
  target: Ind
  specialSpell: Ritual
  formReq: Mentem
  description: |
    Brings the semblance of life to a corpse. During the ritual, healing
    spells work on the corpse, which is important because the body must be
    physically whole or else it simply dies again once it is brought back to
    life. For each day that the person has been dead, roll for aging. When
    the ritual is complete, roll a simple die to determine the success of
    the attempt:

    | Roll  | Result |
    | :-  | :- |
    | 1       | Body dissolves |
    | 2       | Body possessed by a demon, faerie, or other supernatural entity |
    | 3       | Mindless, useless living corpse |
    | 4--5    | Automaton with no Abilities over 3 |
    | 6--7    | Automaton, but Abilities as a normal person's |
    | 8       | Person with self direction but no personality, and somehow dangerously demented |
    | 9--10   | Person with will, but no personality. The revived person is not truly alive and cannot gain experience points. Must make an aging roll at the beginning of each year of existence, regardless of age. This is the closest the Order has gotten to raising the dead. |

  design: Base 70, +1 Touch, no addition for requisite)

