- spell: Curse of the Unportended Plague
  cite: [Redcap](https://www.redcap.org/page/Ars_Magica_Definitive_Edition,_Chapter_Nine:_Spells#Curse_of_the_Unportended_Plague)
  level: 55
  technique: Pe
  form: Co
  range: Sight
  duration: Mom
  target: Bound
  specialSpell: Ritual
  description: |
    Starts a plague in a city or other Boundary. Everyone within the
    boundary is afflicted with the disease when the ritual is complete, and
    suffers as described under Curse of the Leprous Flesh, on the previous
    page. The conditions causing the disease last but a moment, so people
    entering the area after the spell is cast are safe. Using, or even
    transcribing, this spell is rigorously discouraged by most of the Order
    of Hermes. (Note: the disease caused by this spell is not the later
    Bubonic Plague, which is unknown in Europe in 1220.)
  design: Base 20, +3 Sight, +4 Bound
- spell: Curse of the Unruly Tongue
