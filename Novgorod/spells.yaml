[]{#rego-corpus-guidelines}

::: {.mw-heading .mw-heading3}
### Rego Corpus Guidelines {#Rego_Corpus_Guidelines}
:::

Rego Corpus botches often take control of the caster\'s body, and move
it in ways he would not want.

Rego Corpus can be used to perform surgery. Detailed rules for surgery
can be found in Art and Academe.

  ----------------------------------- -----------------------------------
  Level                               Rego Corpus Guideline

  General                             • Ward against creatures associated
                                      with Corpus from one realm (Divine,
                                      Faerie, Infernal, or Magic) with a
                                      Might less than or equal to the
                                      level of the spell (note that
                                      Hermetic magi have no Might, and
                                      thus are not affected by such
                                      spells) (Touch, Ring, Circle)

  2                                   • Make a target lose control of a
                                      body part

  3                                   • Move a target slowly in one
                                      direction, as long as the surface
                                      can support its weight\
                                      • Invoke a minor symptom of a
                                      disease without creating any
                                      underlying malaise (e.g. rash, mild
                                      fever, cough)

  4                                   • Control the large-scale physical
                                      movements of a target\
                                      • Move a target slowly in any
                                      direction you please\
                                      • Move a target slowly straight up,
                                      or in one direction over surfaces
                                      that cannot support it

  5                                   • Hold a target\'s body motionless\
                                      • Invoke a major symptom of a
                                      disease without creating any
                                      underlying malaise (e.g. vomiting,
                                      boils, paralysis)\
                                      • Move a target slowly in any
                                      direction you please, even if the
                                      target is unsupported\
                                      • Perform a trivial surgical
                                      procedure (inflicting a Fatigue
                                      level)\
                                      • Control a disembodied spirit
                                      associated with Corpus

  10                                  • Control a target\'s motions\
                                      • Eliminate the penalties of
                                      Fatigue and wounds\
                                      • Animate a corpse\
                                      • Transport the target instantly up
                                      to 5 paces\
                                      • Perform a minor surgical
                                      procedure, inflicting a Light Wound
                                      or preventing a Light Wound from
                                      worsening

  15                                  • Direct the flow of bodily energy\
                                      • Move a target quickly in any
                                      direction you please, even if it is
                                      unsupported\
                                      • Summon a disembodied spirit
                                      associated with Corpus\
                                      • Transport the target instantly up
                                      to 50 paces\
                                      • Ward a target against other human
                                      beings (to ward off a Hermetic
                                      magus, the ward must penetrate his
                                      Magic Resistance)\
                                      • Perform a major surgical
                                      procedure, inflicting a Medium
                                      Wound or preventing a Medium Wound
                                      from worsening

  20                                  • Transport the target instantly up
                                      to 500 paces\
                                      • Perform a critical surgical
                                      procedure, preventing a Heavy Wound
                                      from worsening

  25                                  • Transport the target instantly up
                                      to one league\
                                      • Perform a life-saving surgical
                                      procedure, preventing an
                                      Incapacitating or Fatal Wound from
                                      worsening

  30                                  • Transport the target instantly up
                                      to seven leagues

  35                                  • Transport the target instantly to
                                      a place you have an Arcane
                                      Connection to
  ----------------------------------- -----------------------------------

  -----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
  Community Gloss
  The rules are intentionalyy vague as to whether teleporation requires casting requisties, as discussed in [Transforming Mythic Europe](/page/Transforming_Mythic_Europe_Chapter_Four:_Magic_as_Technology#Instant_Transportation_and_Requisites "Transforming Mythic Europe Chapter Four: Magic as Technology"). That section also suggests imagining swift movement rather than teleportation as an [optional rule](/page/Transforming_Mythic_Europe_Chapter_Four:_Magic_as_Technology#Optional_Rule:_Limits_on_Instant_Transportation "Transforming Mythic Europe Chapter Four: Magic as Technology"). Finally, note that the example teleporation spell *The Seven-league Stride* requires a Finesse roll; this can be taken to apply to all teleportation or instant-travel spells.
  -----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

