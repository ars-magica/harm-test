[]{#mirror-of-opposition-form}

::: {.mw-heading .mw-heading5}
- spell: []{#Mirror_of_Opposition_.28form.29}Mirror of Opposition (form) {#Mirror_of_Opposition_(form)}
:::

  range: Voice
  duration: Mom
  target: Ind\
Cast on another spell while the other spell is being cast, this causes
the targeted spell to have the exact opposite of its normal effects.
This effect works on spells up to half the (level -- 5) of the Mirror of
Opposition spell. The effects of the inversion are up to the storyguide
to determine, but the target of the inverted spell usually remains the
same as that of the original spell. The inverted spell cannot overcome
any limitations of Hermetic magic. For example, if a Momentary Perdo
Corpus spell is cast, the inversion is probably a Creo Corpus spell of
Sun duration. There are ten versions of this spell, each affecting
spells of one of the Hermetic forms.\
  design: Base effect, +2 Voice)

[]{#shroud-magic}

::: {.mw-heading .mw-heading5}
- spell: Shroud Magic {#Shroud_Magic}
:::

  range: Touch
  duration: Mom
  target: Ind\
This spell allows a magus to suppress or alter the sigil in a spell that
is currently being cast. The spell to be shrouded can be up to double
the Shroud\'s level, and *Shroud Magic* has the same sigil (or lack of)
as that given to the shrouded spell.\
  design: Base effect, +1 Touch)

[]{#the-sorcerers-fork}

::: {.mw-heading .mw-heading5}
- spell: []{#The_Sorcerer.27s_Fork}The Sorcerer\'s Fork {#The_Sorcerer's_Fork}
:::

  range: Touch
  duration: Mom
  target: Ind\
This spell splits another spell (whose level must be less than or equal
to the level of this spell) into two or more identical spells of reduced
power, which may be cast against two or more separate targets. Each
resulting spell has the same Range and Target (target category, that is
--- the actual target may be different) as the original spell, but the
power of the effect is divided by the number of resulting split spells.
The precise effect is at storyguide discretion. One casting die is
rolled, and the Penetration total is split between the spells. *The
Sorcerer\'s Fork* must be equal to or greater than the level of the
spell that is to be split. The split spell has a targeting penalty as
for multiple casting (see page 225). If the casting magus is not
cooperating, all the split spells will strike the original target.\
  design: Base effect, +1 Touch)

[]{#wizards-boost-form}

::: {.mw-heading .mw-heading5}
- spell: []{#Wizard.27s_Boost_.28Form.29}Wizard\'s Boost (Form) {#Wizard's_Boost_(Form)}
:::

  range: Touch
  duration: Mom
  target: Ind\
You cast this spell as another spell of a level less than or equal to
this one is cast. The effect of the other spell increases 5 levels in
power, but not past the level of the Wizard\'s Boost. The effects of the
extra 5 levels of power are for the storyguide to determine. A Wizard\'s
Boost may never affect a single spell more than once. There are ten
versions of this spell, one for each Hermetic Form.\
  design: Base effect, +1 Touch)

[]{#wizards-communion}

::: {.mw-heading .mw-heading5}
- spell: []{#Wizard.27s_Communion}Wizard\'s Communion {#Wizard's_Communion}
:::

  range: Voice
  duration: Mom
  target: Group\
This spell lets magi combine their power to cast spells. The group of
magi work together to cast a specified spell through the unified power
of the Communion. Only one extra magus may join the Communion for each 5
levels of the specified spell being cast. One of the magi in the group
must also know the specified spell, or cast it from a Casting Tablet
(page 263). Only one magus in the group needs to cast the spell. The
magus who casts the Wizard\'s Communion need not be the one who casts
the main spell, and normally it is better for them to be different. More
than one magus in the group may cast this spell. In this case, add the
total levels of successfully cast Wizard\'s Communion to get the
effective level of the Wizard\'s Communion for this casting. This
combined total must be at least twice the level of the specified spell
being cast. One magus must roll for success as if casting the specified
spell himself. However, the target number for the spellcasting roll is
the spell\'s level divided by the number of magi participating in the
Communion. So if five magi participate to cast a 50th level spell, the
caster would have to successfully cast a 10th level spell --- with all
the relevant requisites, of course. This method of casting adds one
botch die per magus participating. If the spell botches, all
participants gain Warping Points and must check for Twilight if they
gain two or more. Communion is a remnant of Mercurian rituals, so it
does not perfectly fit into the guidelines of Hermetic theory.\
  design: Base effect)

[]{#wizards-reach-form}

::: {.mw-heading .mw-heading5}
- spell: []{#Wizard.27s_Reach_.28Form.29}Wizard\'s Reach (Form) {#Wizard's_Reach_(Form)}
:::

  range: Voice
  duration: Mom
  target: Ind\
The range of the targeted spell increases by one category. You may not
affect a single spell more than once with this spell, and the targeted
spell must be at least one magnitude lower in level than this spell.
There are ten versions of *Wizard\'s Reach*, one for each Form.\
  design: Base effect, +2 Voice)

[]{#wizards-vigil}

::: {.mw-heading .mw-heading5}
- spell: []{#Wizard.27s_Vigil}Wizard\'s Vigil {#Wizard's_Vigil}
:::

  range: Voice
  duration: Sun
  target: Group\
This spell functions as *Wizard\'s Communion*, except that the longer
duration allows it to be used with Ritual spells. For the purposes of
its effect, treat it as a *Wizard\'s Communion* of two magnitudes
lower.\

