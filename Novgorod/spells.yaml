  design: Base 25, +2 Sun)
- spell: Cloak of Mist
  cite: [Redcap](https://www.redcap.org/page/Ars_Magica_Definitive_Edition,_Chapter_Nine:_Spells#Cloak_of_Mist)
  level: 40
  technique: Mu
  form: Co
  range: Per
  duration: Sun
  target: Ind
  formReq: Auram
  description: |
    You turn yourself into a thick, cohesive mist of approximately human
    size. You can float through the air at walking speed and can see and
    hear what is going on around you. You can also seep through cracks, but
    cannot move through solid objects. You may return to human form at any
    time, but doing so ends the spell. As mist, you are subject to the
    forces of the wind. In order to cast this spell, you inhale some mist,
    and you keep the mist in your 'mouth' until you want to end the
    spell.
  design: Base 30, +2 Sun)
- spell: Transform to Water
  cite: [Redcap](https://www.redcap.org/page/Ars_Magica_Definitive_Edition,_Chapter_Nine:_Spells#Transform_to_Water)
  level: 40
  technique: Mu
  form: Co
  range: Per
  duration: Sun
  target: Ind
  formReq: Aquam
  description: |
    You turn yourself into water, one pint for every pound of the your
    weight. As water, you can hold yourself together unless someone makes an
    effort to separate part of you from the rest. You can roll slowly across
    the ground, but cannot move uphill. You can hear sounds, feel things
    that touch you, and can sense temperature. You can resume human form at
    will, but doing so ends the spell. You cannot resume human form if a
    significant part of your body/water is separated from the rest. You pour
    a small amount of water into your hands when you cast the spell.
  design: Base 30, +2 Sun)
- spell: The Silent Vigil
  cite: [Redcap](https://www.redcap.org/page/Ars_Magica_Definitive_Edition,_Chapter_Nine:_Spells#The_Silent_Vigil)
  level: 45
  technique: Mu
  form: Co
  range: Per
  duration: Moon
  target: Ind
  formReq: Terram
  description: |
    You can move into and become part of a rock formation that is at least
    twice your size. While in the stone, you can hear what is going on
    around you, but you cannot use other senses. The spell lasts until you
    come out, and you must come out where you went in. You have no need for
    food or drink, though you do age. Rolls to recover from Fatigue or
    wounds take twice as long to make while you are in the stone. Casting
    requisites are required for items you take with you into the stone.
  design: Base 25, +3 Moon, +1 for special effect)
- spell: Mists of Change
  cite: [Redcap](https://www.redcap.org/page/Ars_Magica_Definitive_Edition,_Chapter_Nine:_Spells#Mists_of_Change)
  level: 60
  technique: Mu
  form: Co
  range: Voice
  duration: Sun & Year
  target: Bound
  specialSpell: Ritual
  formReq: Animal
  description: |
    As this spell is cast, a whipping wind arises and patches of mist begin
    to roll across the landscape. Sometimes, a patch of mist suddenly
    envelops a person for a few seconds, during which time the victim cannot
    move. When the mist blows away, continuing its course, the person is
    left transformed into a random creature. Roll a simple die to determine
    the result:

    | Roll  | Animal |
    | :--  | :-- |
    | 1     | Wolf |
    | 2     | Horse |
    | 3     | Brown Bear |
    | 4     | Large Toad |
    | 5     | Ferret |
    | 6     | Viper |
    | 7     | Boar/Sow |
    | 8     | Dog |
    | 9     | Cat |
    | 0     | Other (storyguide picks; be cruel) |

    People transformed retain their human minds, but inherit all the
    passions and instincts of their new forms. The mist covers the target
    area, which must be in sight when you cast the spell. The mists affect
    the area until sunrise or sunset, and transform anyone who remains in
    the area during that time. For important characters, roll a simple die
    when the spell is cast and every half hour afterwards, and on a roll
    lower than the number of rolls made so far the mists envelope and
    transform them at some point in the next half hour. The transformations
    last for a Year.
  design: |
    Base 10, +2 Voice, +4 Year, +4 Bound,
    slightly nonstandard effect, mist and wind are cosmetic only
