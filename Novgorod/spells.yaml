  design: Base 4, +2 Voice, +1 Conc)
- spell: The Gift of Vigor
  cite: [Redcap](https://www.redcap.org/page/Ars_Magica_Definitive_Edition,_Chapter_Nine:_Spells#The_Gift_of_Vigor)
  level: 20
  technique: Re
  form: Co
  range: Touch
  duration: Mom
  target: Ind
  description: |
    Transfers bodily energy from you to any target who is at a lower Fatigue
    level than you. You are thus at the target's current Fatigue level, and
    he or she assumes your previous level. If you lose a Fatigue level from
    casting this spell, the loss comes after the transfer. Magi have long
    looked for a way to restore their energy in order to cast more spells.
    This is the closest they've come.

    *Community Gloss*
    It isn't clear whether the caster fatigues himself, or gains vitality.
    The title of the fatigue table in the Obstacles chapter indicates a "lower"
    fatigue level corresponds to being less fatigued, so that the spell restores
    *your* fatigue. Then again, the idea of transferring energy "from you" implies
    that you are drained, so that the spell restores *another's* fatigue;
    this is also the more convervative reading, as it is less exploitable.
  design: Base 15, +1 Touch)
- spell: Awaken the Slumbering Corpse
  cite: [Redcap](https://www.redcap.org/page/Ars_Magica_Definitive_Edition,_Chapter_Nine:_Spells#Awaken_the_Slumbering_Corpse)
  level: 25
  technique: Re
  form: Co
  range: Voice
  duration: Conc
  target: Ind
  description: |
