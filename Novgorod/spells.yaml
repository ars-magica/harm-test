[]{#intellego-mentem-guidelines}

::: {.mw-heading .mw-heading3}
### Intellego Mentem Guidelines {#Intellego_Mentem_Guidelines}
:::

These spells are superb for cutting through the confusion of social
interaction and the endless banter of the rabble. The lnAn spells that
deal with the mind may also be used for ideas and guidelines for this
section.

Note that writing does not contain any information of itself, and is
generally Animal and Herbam or Terram, for the materials, not Mentem. To
translate writing, you need someone who can read it, although you could
read the translation from their mind.

In general, a momentary Mentem spell can answer a single question,
although it is not necessary that the answer be expressible in a brief
form. A Momentary spell could, for example, tell you exactly how the
target felt about his father, no matter how complex the feeling, but it
wouldn\'t tell you why he felt that way. Finding out a lot of
information takes time.

Sigils for InMe spells usually involve information being transmitted in
unique ways.

Intellego Mentem botches normally supply false information.

  ----------------------------------- -------------------------------------------------------------------------------------------------------
  Level                               Intellego Mentem Guideline

  4                                   • Sense the state of consciousness of one intelligent being (for example, asleep, awake, meditating,
                                      dead, drugged, insane, or comatose)

  5                                   • Sense a single emotion in a being. *Community Gloss: [Art &
                                      Academe](/page/Art_%26_Academe_Open_Content#Intellego_Mentem_Guidelines "Art & Academe Open Content")
                                      extends this to include a single sensory input.*\
                                      • Understand the meaning behind spoken sounds

  10                                  • Sense all of the emotions in a being. *Community Gloss: [Art &
                                      Academe](/page/Art_%26_Academe_Open_Content#Intellego_Mentem_Guidelines "Art & Academe Open Content")
                                      extends this to a single sensory input.*\
                                      • Discover the truth of a statement

  15                                  • Speak with any one human\
                                      • Read a person\'s surface thoughts. *Community Gloss: [Art &
                                      Academe](/page/Art_%26_Academe_Open_Content#Intellego_Mentem_Guidelines "Art & Academe Open Content")
                                      extends this to perceiving whatever the target is perceiving with all of his sense organs.*\
                                      • Pick a single answer from the mind of a target

  20                                  • Read the last day\'s memories from one person. *Community Gloss: [Art &
                                      Academe](/page/Art_%26_Academe_Open_Content#Intellego_Mentem_Guidelines "Art & Academe Open Content")
                                      says this guideline can also read the short-term plans from the person's cognition. If cast while a
                                      target is dreaming, spells based on this guideline can eavesdrop on those dreams.*

  25                                  • Learn all the information you wish from a person\'s mind
  ----------------------------------- -------------------------------------------------------------------------------------------------------

