- spell: Stance of the Patient Tree
  cite: [Redcap](https://www.redcap.org/page/Ars_Magica_Definitive_Edition,_Chapter_Nine:_Spells#Stance_of_the_Patient_Tree)
  level: 30
  technique: Mu
  form: Co
