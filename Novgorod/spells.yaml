### Intellego Ignem Guidelines {#Intellego_Ignem_Guidelines}
:::

Intellego Ignem botches typically provide false information, although
they may also render the caster incapable of detecting heat or flames
for a time.

  ----------------------------------- -----------------------------------
  Level                               Intellego Ignem Guideline

  1                                   • Sense one property of a fire\
                                      • Locate a fire

  2                                   • Sense all mundane properties of a
                                      fire\
                                      • Become aware of all fires within
                                      the target area\
                                      • See a fire\
                                      • Sense levels of heat

  3                                   • Sense all mundane properties of
                                      ash\
                                      • Detect the traces of fires which
                                      burned within the last lunar month

  4                                   • See clearly through raging fire
                                      (an Auram requisite may be
                                      necessary if smoke is present as
                                      well)\
                                      • Learn the magical properties of a
                                      fire

  10                                  • See a fire and all things it
                                      illuminates (for example, see a
                                      campfire and everything within its
                                      circle of light)

  20                                  • Speak with a fire
  ----------------------------------- -----------------------------------

