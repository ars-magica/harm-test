  -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
  Community Gloss
  It isn\'t clear whether the caster fatigues himself, or gains vitality. The title of the fatigue table in the Obstacles chapter indicates a \"lower\" fatigue level corresponds to being less fatigued, so that the spell restores *your* fatigue. Then again, the idea of transferring energy \"from you\" implies that you are drained, so that the spell restores *another\'s* fatigue; this is also the more convervative reading, as it is less exploitable.
  -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

