[]{#perdo-corpus-guidelines}

::: {.mw-heading .mw-heading3}
### Perdo Corpus Guidelines {#Perdo_Corpus_Guidelines}
:::

These spells harm people directly, often permanently, unless outside
magics are used to repair the damage.

Diseases caused by magic have a base Ease Factor of 6. For every
magnitude by which the spell level increases, the Ease Factor increases
by 1. It is not possible to reduce the level by reducing the Ease
Factor. (See page 8)

  ----------------------------------- -----------------------------------
  Level                               Perdo Corpus Guideline

  3                                   • Do superficial damage to a body
                                      (for example, remove its hair)

  4                                   • Cause a person pain, but do no
                                      real damage

  5                                   • Inflict a Light Wound\
                                      • Destroy a corpse\
                                      • Hamper a person without actually
                                      injuring them (for example, make
                                      them lame, blur their eyesight;
                                      heals as a Light Wound)

  10                                  • Inflict a Medium Wound\
                                      • Cause the loss of a Fatigue level

  15                                  • Age someone by up to five years\
                                      • Cripple a limb, making it
                                      unusable but still capable of
                                      healing (heals as a Medium Wound)\
                                      • Destroy one of a person\'s minor
                                      senses (heals as a Medium Wound)\
                                      • Inflict a Heavy Wound

  20                                  • Destroy one of a person\'s major
                                      senses (heals as a Heavy Wound)\
                                      • Inflict a major disease\
                                      • Destroy or sever a limb, so that
                                      it cannot heal naturally\
                                      • Inflict an Incapacitating Wound

  30                                  • Kill a person

  40                                  • Destroy one property of a person,
                                      such as their weight or solidity
  ----------------------------------- -----------------------------------

