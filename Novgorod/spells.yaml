It does not grant any information apart from the power, however. The
residue must be of at least zero magnitude.\
  design: Base 10, +1 Conc, +3 Hearing)

[]{#level-40-13}

::: {.mw-heading .mw-heading4}
#### LEVEL 40 {#LEVEL_40_14}
:::

[]{#sight-of-the-active-magics}

::: {.mw-heading .mw-heading5}
- spell: Sight of the Active Magics {#Sight_of_the_Active_Magics}
:::

  range: Per
  duration: Conc
  target: Vision\
You can see spells as \"auras\" around things and people. The color of
the aura indicates the Form of the spell working on a subject, the color
matching the appropriate one described in Sense the Nature of Vis (page
367). The Technique of a spell working on the subject is recognized by
the aura\'s shape, not color. Creo and Rego are both very orderly auras.
Muto is constantly shifting, and Intellego usually is as well, but more
slowly. A Perdo aura is usually in fragments. Thus, a magus with both
Endurance of the Berserkers and The Invisible Eye Revealed upon him has
a very controlled, orderly aura of deep red around his or her entire
body, and the magus\'s eyes are surrounded with slowly shifting auras of
a silvery hue. You should be warned: Imaginem or Vim spells may be used
to disguise auras. Also note that this spell will detect the residues of
some spells.\
  design: Base 5, +1 Conc, +4 Vision, +2 Techniques and Forms)

[]{#muto-vim-guidelines}

::: {.mw-heading .mw-heading3}
### Muto Vim Guidelines {#Muto_Vim_Guidelines}
:::

These spells let you change other spells.

These meta-magical spells have certain special restrictions, which apply
to all Muto Vim spells invented according to Hermetic theory. First of
all, they cannot be cast on Spontaneous spells. Such magic is being
manipulated at whim-any attempt to alter it further would make the
caster lose control. (This is necessary for game balance.)

Second, you must make an Intelligence + Concentration roll against an
Ease Factor of 9 if you are casting both spells (that is, the MuVi spell
and the spell it is affecting). If this fails, the spells do not go off.
If it botches, they botch. (This is slightly easier than normal.)

If you wish to cast one of these spells on a spell being cast by another
magus, you must either be co-operating, or you must fast cast the MuVi
spell. There is no other way to get the timing right. In addition, your
Penetration total for the Muto Vim spell must beat the other magus\'s
Penetration total for the spell to be changed, unless you are
co-operating.

Touch range is sufficient to affect your own spells, but Voice range, at
least, is needed to affect another magus\'s casting. You cannot touch
the spell itself.

These spells can only be used on Hermetic magic, as they depend on a
good understanding of the processes involved.

You may only put a Muto Vim effect into a magical item if it is to work
with another effect in that item. All Muto Vim spells require some
tailoring to the specific use, and a magical item effect cannot be so
tailored.

Note that a spell invented according to one of the guidelines below will
change another spell in a specific way: it is not possible to invent a
single spell which changes another spell however the caster wants. See
the example spells for ideas on how specific this should be.

It is not possible, for reasons that Hermetic theorists do not well
understand, to use Muto Vim to affect another spell after it has been
cast.

If the parameters of an effect after it has been changed by a Muto Vim
spell would normally require a Ritual, then at least one of the original
spell and the Muto Vim spell must be a Ritual. For example, a Formulaic
or Spontaneous Muto Vim effect on a Formulaic spell cannot produce an
effect that would normally require a Ritual.

Muto Vim botches can have any conceivable effect, as they alter the
other spell in unpredictable ways.

Muto Vim spells work by altering the magical energies that create the
spell as it is being cast. The spell is the result of the combination of
the base casting and the Muto Vim effect, and has its effect once both
the casting and the Muto Vim effect have finished. This means that a
Muto Vim spell must have a duration at least as long as the casting of
the target spell, but need not last for as long as the spell itself. For
normally-cast formulaic spells, a Momentary Duration is sufficient, but
if the casting time is longer for any reason, the Muto Vim spell must
also have a longer Duration; Sun is sufficient for any practical Ritual.

An increase in power or parameters may not raise the level of the target
spell above the level of the Muto Vim spell.

  ----------------------------------- -----------------------------------
  Level                               Muto Vim Guideline

  General                             • Superficially change a spell of
                                      less than or equal to twice the
                                      (level + 1 magnitude) of the Vim
                                      spell (this may not change the
                                      primary effect of the spell, or its
                                      power)\
                                      • Significantly change a spell of
                                      less than or equal to the level + 1
                                      magnitude of the Vim spell (this
                                      may not change either the Technique
                                      or Form of the target spell; a
                                      change in power of plus or minus
                                      one magnitude is a significant
                                      change, as is a change of target if
                                      the target was possible for the
                                      original spell)\
                                      • Totally change a spell of less
                                      than or equal to half the (level +
                                      1 magnitude) of the Vim spell (this
                                      may change the Technique, Form, or
                                      both of the target spell, and needs
                                      no requisites for those Arts; the
                                      Vim spell affects the structure of
                                      the spell, not the things that the
                                      spell targets; a change in power of
                                      up to two magnitudes is a total
                                      change; any greater change requires
                                      either Creo or Perdo to create more
                                      magical energy or destroy some)
  ----------------------------------- -----------------------------------

> []{#muto-vim-spells--enchanted-devices}
>
> ::: {.mw-heading .mw-heading3}
> ### []{#Muto_Vim_Spells_.26_Enchanted_Devices}Muto Vim Spells & Enchanted Devices {#Muto_Vim_Spells_&_Enchanted_Devices}
> :::
>
> Muto Vim spells affect other spells, and can also affect spell-like
> effects instilled in enchanted devices, as long as certain conditions
> are met.
>
> A Muto Vim effect can be put into a magical item, as long as it
> affects another power instilled in the item. If spell-like powers in a
> magical item can be manipulated by Muto Vim effects, then spell-like
> powers can also be manipulated by Muto Vim spells. The reverse is not
> true; a general purpose Muto Vim spell-like effect cannot be instilled
> in a magical item with the intent to affect spells that the wielder
> desires to target. Muto Vim spell-like effects can only affect other
> spell-like effects in the same magical item.
>
> If the magus casting the Muto Vim spell is the same person activating
> a magical item, then the standard rules for casting a Muto Vim spell
> apply. The caster must succeed with an Intelligence + Concentration
> roll against an Ease Factor of 9.
>
> If the magus is not the same person activating the magical item, the
> rules governing a Muto Vim spell cast on another magus\' spell apply.
> If an ally activates the magical item, and the magus and
> item-activator have worked out the timing issues before hand, the two
> are considered to be cooperating. The caster must succeed with an
> Intelligence + Concentration roll against an Ease Factor of 9.
>
> If the caster and the item-activator have not worked out the timing
> issues beforehand, then they are not cooperating. An enemy using a
> magical item falls into this category. In this case, the magus must
> fast cast the Muto Vim spell. He must also beat the magical item\'s
> Penetration with his Muto Vim spell\'s Penetration. Because most Muto
> Vim spells are Form specific, he must also correctly identify the Form
> of the device\'s spelllike effect. Use the Determining Form of Magical
> Effect formula (page 217) to determine whether the magus is
> successful. If the magus correctly identifies the Form, succeeds with
> a fast cast defense roll against the item-activator\'s Initiative
> roll, and casts his spell with higher Penetration than the device\'s
> Penetration, his Muto Vim spell affects the device\'s spell-like
> effect.
>
> All other Muto Vim spell rules apply. The magical item must be
> Hermetic. The Muto Vim spell can have Range Touch if the magus is
> holding the magical item, but must have Range Voice, at least, if
> someone else is holding the magical item or he triggers it from a
> distance.

