    used cannot have been buried by Church ceremony.
  design: Base 10, +2 Voice, +1 Conc)
- spell: Strings of the Unwilling Marionette
  cite: [Redcap](https://www.redcap.org/page/Ars_Magica_Definitive_Edition,_Chapter_Nine:_Spells#Strings_of_the_Unwilling_Marionette)
  level: 25
  technique: Re
  form: Co
  range: Voice
  duration: Conc
  target: Ind
  description: |
