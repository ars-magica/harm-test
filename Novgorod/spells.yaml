  design: Base 10, +2 Voice, +1 Conc
- spell: Seven-league Stride
  cite: [Redcap](https://www.redcap.org/page/Ars_Magica_Definitive_Edition,_Chapter_Nine:_Spells#Seven-league_Stride)
  level: 30
  technique: Re
  form: Co
  range: Per
  duration: Mom
  target: Ind
  description: |
    Transports you to any place within seven leagues either that you can see
    or that you have an Arcane Connection with. If you fail an
    Intelligence + Finesse stress roll against an Ease Factor of 9, your
    arrival goes slightly awry. For instance, you might fall when you
    appear, or just be facing the wrong way. A botch means you appear in the
    wrong place. perhaps even in a wall. Praefactus of Bonisagus's version
    of this spell always allows him to appear in a safe, unembarrassing
    place (assuming he doesn't fail his Finesse roll). All Praefactus's
    spells make him seem as dignified as possible - manifesting his
    wizard's sigil.
  design: Base 30
- spell: The Leap of Homecoming
  cite: [Redcap](https://www.redcap.org/page/Ars_Magica_Definitive_Edition,_Chapter_Nine:_Spells#The_Leap_of_Homecoming)
