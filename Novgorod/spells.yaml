                                      object\
                                      • Transform species that affect one
                                      sense into those that affect
                                      another (for example, transform
                                      audible species into visual
                                      species, so that sounds can be
                                      seen)

  3                                   • Change three sensations of an
                                      object

  4                                   • Change four sensations of an
                                      object

  5                                   • Change the appearance of an
                                      object completely, in all things
                                      except solidity
  ----------------------------------- -----------------------------------

