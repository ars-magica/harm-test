[]{#intellego-imaginem-guidelines}

::: {.mw-heading .mw-heading3}
### Intellego Imaginem Guidelines {#Intellego_Imaginem_Guidelines}
:::

Generally, these spells have the least to do with illusions of all the
Imaginem spells, because one detects an image without altering or
controlling it. These spells improve upon your senses by bringing in
images (usually sounds and sights) not normally available.

Note that seeing or hearing into another room or a hundred miles away
does you no good if there is no light or sound there. As in Crlm spells,
each additional sense you wish to perceive increases the level of the
spell by one magnitude.

As with most Intellego magic, Intellego Imaginem botches normally give
false information.

  ----------------------------------- -----------------------------------
  Level                               Intellego Imaginem Guideline

  General                             • Discern illusions caused by
                                      spells of equal or lower level than
                                      the level of this spell (Vision
                                      target)

  1                                   • Use one sense at a distance\
                                      • Memorize or perfect your memory
                                      about an image you have
                                      encountered\
                                      • Be able to discern your own false
                                      images

  2                                   • Use two senses at a distance

  3                                   • Use three senses at a distance\
                                      • Enhance one of your senses in one
                                      way (to see clearly at a distance,
                                      to see small things, or to see in
                                      the dark, for example)

  4                                   • Use four senses at a distance

  5                                   • Use all senses at a distance
  ----------------------------------- -----------------------------------

