[]{#rego-ignem-guidelines}

::: {.mw-heading .mw-heading3}
### Rego Ignem Guidelines {#Rego_Ignem_Guidelines}
:::

The intensity of a fire also affects the difficulty of controlling it.
For every five points by which the fire\'s damage exceeds +5, add one
magnitude to the level of the spell.

Rego Ignem spells can control heat or light as well as fire.

Rego Ignem botches normally result in the fire doing exactly what the
caster does not want.

  ----------------------------------- -----------------------------------
  Level                               Rego Ignem Guideline

  General                             • Ward against beings associated
                                      with Ignem from one supernatural
                                      realm (Divine, Faerie, Infernal, or
                                      Magic) with Might less than or
                                      equal to the level of the spell
                                      (Touch, Ring, Circle)

  3                                   • Control a fire in a natural
                                      fashion (for example, control its
                                      direction of spread)\
                                      • Move a fire quickly through space
                                      while leaving it burning naturally\
                                      • Transport a fire instantly up to
                                      5 paces (add 1 magnitude to
                                      increase the distance to 50 paces,
                                      2 magnitudes for 500 paces, 3
                                      magnitudes for 1 league, 4
                                      magnitudes for seven leagues, and 5
                                      magnitudes to a place for which you
                                      have an Arcane Connection)

  4                                   • Control a fire in a slightly
                                      unnatural fashion (for example,
                                      stop it from burning a person)

  5                                   • Control a disembodied spirit
                                      associated with Ignem\
                                      • Completely control a fire
                                      elemental

  10                                  • Control a fire in a very
                                      unnatural fashion (for example,
                                      fashion into a dancing humanoid
                                      shape)

  15                                  • Summon a disembodied spirit
                                      associated with Ignem\
                                      • Ward against fire doing up to +5
                                      damage (Touch, Ring, Circle)

  20                                  • Ward against fire doing up to +10
                                      damage (Touch, Ring, Circle)

  25                                  • Ward against fire doing up to +15
                                      damage (Touch, Ring, Circle)

  30                                  • Ward against fire doing up to +20
                                      damage (Touch, Ring, Circle)

  35                                  • Ward against fire doing up to +25
                                      damage (Touch, Ring, Circle)

  40                                  • Ward against fire doing up to +30
                                      damage (Touch, Ring, Circle)
  ----------------------------------- -----------------------------------

