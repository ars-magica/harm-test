[]{#perdo-mentem-guidelines}

::: {.mw-heading .mw-heading3}
### Perdo Mentem Guidelines {#Perdo_Mentem_Guidelines}
:::

Emotions naturally reappear in a person, so spells that destroy them
must have a continuing duration to ensure that they do not come back.
Memories do not naturally return, so Momentary Duration spells remove
them forever, although a person could be told what he had forgotten, or
reconstruct the memory from things he does remember. A continuing spell
would prevent a person from relearning that information, however.

  -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
  Community Gloss
  [Art & Academe](/page/Art_%26_Academe_Open_Content#Perdo_Mentem_Guidelines "Art & Academe Open Content") maintains that all the guidelines that affect memories (rather than details from memories) can affect imagination or cognition as well, and that all the guidelines that affect emotions work through the estimation, and can also affect the common sense. Quelling the estimation can also cause a person to neglect appetitive urges for shelter, rest, food, and drink, although the estimation must be removed entirely to cause the target to suffer deprivation through this neglect. Quelling the common sense leaves the target unable to correctly interpret a particular type of sensory input --- he might see, but be unable to understand what he is seeing.
  -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

  ----------------------------------- -------------------------------------------------------------------------------------------------------------------------------------------------------------------------
  Level                               Perdo Mentem Guideline

  3                                   • Remove a minor detail from a person\'s memory

  4                                   • Remove an important detail from a person\'s memory\
                                      • Diminish a single mental capability in a person. *Community Gloss: See the [House Jerbiton description in Houses of Hermes:
                                      Societates](/page/Houses_of_Hermes:_Societates_Chapter_Three:_House_Jerbiton#Diminished_Mental_Capability "Houses of Hermes: Societates Chapter Three: House Jerbiton")
                                      for examples.*\
                                      • Reduce the intensity of all of a person\'s emotions

  5                                   • Quell an emotion in a person

  10                                  • Remove a minor or short memory from a person\'s mind. *Community Gloss: [Art &
                                      Academe](/page/Art_%26_Academe_Open_Content#Perdo_Mentem_Guidelines "Art & Academe Open Content") adds that this guideline can stop a person thinking about a certain
                                      thing, or make him neglect one of his goals or banish a dream.*\
                                      • Reduce all of a person\'s mental capabilities

  15                                  • Remove a major or long memory from a person\'s mind.*Community Gloss: [Art &
                                      Academe](/page/Art_%26_Academe_Open_Content#Perdo_Mentem_Guidelines "Art & Academe Open Content") adds that this guideline can prevent all active thought through the
                                      imagination; or stifle creative thought or prevent dreaming entirely through the cognition*\
                                      • Remove all emotions from a person\
                                      • Drive a person insane

  25                                  • Leave a person a mindless husk
  ----------------------------------- -------------------------------------------------------------------------------------------------------------------------------------------------------------------------

