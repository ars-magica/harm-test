  design: Base 10, +1 Conc)
- spell: Gift of the Frog's Legs
  cite: [Redcap](https://www.redcap.org/page/Ars_Magica_Definitive_Edition,_Chapter_Nine:_Spells#Gift_of_the_Frog's_Legs)
  level: 15
  technique: Re
  form: Co
  range: Touch
  duration: Mom
  target: Ind
  description: |
    Allows the target to leap up to 15 feet vertically or 25 feet
    horizontally (2 feet less for every Encumbrance point). The person must
