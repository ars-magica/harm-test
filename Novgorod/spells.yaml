                                      trait). This applies to spells that create an emotion directed at a particular person or object; base 5 is needed for emotions directed at more general stimulai.*\
                                      • Restore a memory of a brief event to a fresh state, as long as a fragment of it remains (the affected memory can be no more extensive than a short conversation
                                      of two or three rounds)

  5                                   • Create a memory in another\'s mind. *Community Gloss: [Art & Academe](/page/Art_%26_Academe_Open_Content#Creo_Mentem_Guidelines "Art & Academe Open Content")
