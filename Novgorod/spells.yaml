[]{#muto-terram-guidelines}

::: {.mw-heading .mw-heading3}
### Muto Terram Guidelines {#Muto_Terram_Guidelines}
:::

The targets below are for changing dirt. To change to or from sand, mud,
or clay, use the same level of magnitude as for dirt. To change to or
from stone or glass, add one level of magnitude. To change to or from
metal or gemstone, add two levels of magnitude. These adjustments only
apply once, so that changing metal to metal is only two magnitudes
higher.

The amount of material you can change is limited by the guidelines for
each end. Thus, you can turn a cubic pace of stone into a cubic inch of
gemstone with a base Individual.

Serious Muto Terram botches have a tendency to turn the caster to stone
or metal, but lesser botches transform the wrong thing, or transform
things in the wrong way.

  ----------------------------------- -----------------------------------
  Level                               Muto Terram Guideline

  General                             • Convert part of an earth
                                      elemental\'s body into another type
                                      of earth (soil to dust, etc.),
                                      reducing the elemental\'s Might
                                      pool by the level of the spell +2
                                      magnitudes. If the elemental is not
                                      destroyed by this effect, when the
                                      duration ends it can restore this
                                      Might by re-absorbing the matter

  1                                   • Change one property of dirt

  2                                   • Change dirt to another type of
                                      natural earth (for example, sand to
                                      loam)

  3                                   • Change dirt so that it is
                                      slightly unnatural (requisites may
                                      be required)\
                                      • Change dirt into a liquid or gas
                                      (with requisites)\
                                      • Change dirt to stone, or vice
                                      versa

  4                                   • Change dirt so that it is highly
                                      unnatural (requisites will often be
                                      required)\
                                      • Change dirt into a mixture of
                                      liquids, solids, and gases (with
                                      requisites)\
                                      • Change dirt into a plant (with
                                      requisites)\
                                      • Make something grow to ten times
                                      its previous volume

  5                                   • Change dirt into a slightly
                                      unnatural liquid or gas (with
                                      requisites)\
                                      • Change dirt into an animal (with
                                      requisites)

  10                                  • Change dirt into a highly
                                      unnatural liquid or gas (with
                                      requisites)
  ----------------------------------- -----------------------------------

