- spell: Endurance of the Berserkers
  cite: [Redcap](https://www.redcap.org/page/Ars_Magica_Definitive_Edition,_Chapter_Nine:_Spells#Endurance_of_the_Berserkers)
  level: 15
  technique: Re
  form: Co
  range: Per.
  duration: Conc.
  target: Ind
  description: |
    Your body acts as though it were unwounded and unfatigued for as long as
    you concentrate. Keep track of the actual Fatigue levels that the body
    loses while "berserk," because as soon as the spell wears off, you
    lose those levels. If you run out of Fatigue levels, the spell
    terminates immediately and you fall unconscious. A character under the
    influence of this spell does risk worsening wounds, but he may not
