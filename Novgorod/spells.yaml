[]{#rego-terram-guidelines}

::: {.mw-heading .mw-heading3}
### Rego Terram Guidelines {#Rego_Terram_Guidelines}
:::

The guidelines for controlling dirt, sand, mud, or clay are listed
below. Add one magnitude to control stone or glass, and two for metal or
gemstones, unless the item is simply being moved from one place to
another (as in Unseen Arm or either Invisible Sling). Manipulating
objects with great precision may also be higher, depending on the level
of precision.

Rego Terram botches often result in the caster being struck by large
amounts of flying stone.

  ----------------------------------- -----------------------------------
  Level                               Rego Terram Guideline

  General                             • Ward against beings associated
                                      with Terram from one supernatural
                                      realm (Divine, Faerie, Infernal, or
                                      Magic) with Might less than or
                                      equal to the level of the spell
                                      (Touch, Ring, Circle)

  1                                   • Control or move dirt in a natural
                                      fashion

  2                                   • Control or move dirt in a
                                      slightly unnatural fashion\
                                      • Keep dirt away from you, under
                                      your conscious control (that is,
                                      you must be aware of its presence)\
                                      • Shape and form dirt, as if a
                                      craftsman had worked it

  3                                   • Control or move dirt in a very
                                      unnatural fashion

  4                                   • Transport a non-living object
                                      instantly up to 5 paces (add one
                                      magnitude for 50 paces, two
                                      magnitudes for 500 paces, three
                                      magnitudes for one league, four
                                      magnitudes for seven leagues, and
                                      five magnitudes for a place to
                                      which you have an Arcane
                                      Connection; casting requisites may
                                      be needed if the item is primarily
                                      not under the Form of Terram)

  5                                   • Keep all dirt away from your
                                      body, or ward a target against
                                      dirt\
                                      • Control a disembodied spirit
                                      associated with Terram\
                                      • Completely control an earth
                                      elemental\
                                      • Hurl a hard projectile with
                                      enough force to do +5 damage (range
                                      increment of 20 paces; this applies
                                      magical force to the projectile at
                                      the moment of casting, and the
                                      projectile then moves naturally)

  10                                  • Hurl a hard projectile with
                                      enough force to do +10 damage
                                      (range increment of 20 paces; this
                                      applies magical force to the
                                      projectile at the moment of
                                      casting, and the projectile then
                                      moves naturally)

  15                                  • Summon a disembodied spirit
                                      associated with Terram\
                                      • Hurl a hard projectile with
                                      enough force to do +15 damage
                                      (range increment of 20 paces; this
                                      applies magical force to the
                                      projectile at the moment of
                                      casting, and the projectile then
                                      moves naturally)
  ----------------------------------- -----------------------------------

